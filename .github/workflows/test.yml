name: test

on:
  push:
    branches: [main]
  pull_request:

permissions: {}  # granted per job below (least privilege)

jobs:
  test:
    permissions:  # checkout + local lint/tests; no GitHub API use
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      # The @rarebit-one/voidbind-web dependency is a PUBLIC git repo pinned by
      # SHA. Force anonymous HTTPS for any git URL so `npm install` clones it
      # without needing a credential (mirrors allthing-tizen's CI rewrite).
      - name: Prefer anonymous HTTPS for git dependencies
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Install
        run: npm install

      - name: Validate config.xml
        run: npm run validate

      - name: Test
        run: npm test

      # Prove the .wgt tree assembles and packages (vendors voidbind-web, zips).
      - name: Build .wgt
        run: npm run build

